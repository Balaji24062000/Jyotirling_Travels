<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#c8202b">
    <title>Jyotirling Travels – Bus Booking App</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;800&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --red: #c8202b;
            --bg: #f2f2f5;
            --card: #fff;
            --text: #1c1d26;
            --mut: #6b6e7e;
            --line: #e4e4ec;
            --ok: #1e9e5a;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --bg: #0f0f15;
                --card: #1b1b25;
                --text: #f1f0f6;
                --mut: #a7a6b8;
                --line: #30304a
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f0f15;
            --card: #1b1b25;
            --text: #f1f0f6;
            --mut: #a7a6b8;
            --line: #30304a
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans Devanagari', 'Poppins', system-ui, sans-serif
        }

        #app {
            max-width: 480px;
            margin: auto;
            min-height: 100vh;
            background: var(--bg);
            padding-bottom: 150px
        }

        svg.i {
            width: 1.2em;
            height: 1.2em;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            vertical-align: -.2em;
            flex: none
        }

        .top {
            background: linear-gradient(135deg, #c8202b, #8f0f19);
            color: #fff;
            padding: 14px 16px 20px;
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 5
        }

        .top.big {
            padding-bottom: 70px;
            position: static
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .sp {
            justify-content: space-between
        }

        .top h1 {
            font: 600 1.05rem Poppins, sans-serif;
            margin: 0
        }

        .top small {
            opacity: .85
        }

        .ib {
            background: rgba(255, 255, 255, .18);
            border: 0;
            color: #fff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            cursor: pointer
        }

        .logo {
            height: 40px;
            background: #fff;
            border-radius: 10px;
            padding: 2px
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 16px;
            margin: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .07)
        }

        .search {
            margin: -52px 12px 12px;
            position: relative
        }

        .cities {
            position: relative
        }

        .cities .c {
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-bottom: 8px
        }

        .c small {
            color: var(--mut);
            display: block;
            font-size: .72rem
        }

        .c b {
            font-size: 1.1rem
        }

        .swap {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--red);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer
        }

        input,
        select {
            font: inherit;
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--text)
        }

        .chips {
            display: flex;
            gap: 8px;
            margin-top: 8px
        }

        .chip {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            border-radius: 99px;
            padding: 6px 14px;
            font: inherit;
            font-size: .85rem;
            cursor: pointer
        }

        .chip.on {
            background: var(--red);
            color: #fff;
            border-color: var(--red)
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 14px;
            font: 600 1rem Poppins, 'Noto Sans Devanagari', sans-serif;
            background: var(--red);
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            gap: 8px;
            align-items: center;
            text-decoration: none
        }

        .btn.w {
            background: #25D366
        }

        .btn.l {
            background: var(--card);
            color: var(--red);
            border: 1.5px solid var(--red)
        }

        .btn:disabled {
            opacity: .45
        }

        .offer {
            background: linear-gradient(120deg, #fff3d6, #ffe1a1);
            color: #4a2f00;
            border-radius: 14px;
            padding: 14px;
            margin: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            font-weight: 600;
            font-size: .9rem
        }

        .photo {
            margin: 12px;
            border-radius: 14px;
            overflow: hidden
        }

        .photo img {
            width: 100%;
            display: block
        }

        .am {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--mut);
            font-size: .78rem;
            margin-top: 8px
        }

        .am span {
            display: flex;
            gap: 4px;
            align-items: center
        }

        .bus h3 {
            margin: 0;
            font-size: 1rem
        }

        .bus .tm {
            font: 700 1.4rem Poppins, sans-serif
        }

        .bus .fare {
            font: 700 1.2rem Poppins, sans-serif;
            color: var(--red)
        }

        .tag {
            background: #e6f6ee;
            color: var(--ok);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: .72rem;
            font-weight: 700
        }

        .seats {
            display: grid;
            grid-template-columns: repeat(2, 1fr) 28px repeat(2, 1fr);
            gap: 9px;
            justify-items: center;
            max-width: 300px;
            margin: 12px auto
        }

        .st {
            width: 46px;
            height: 40px;
            border-radius: 8px 8px 4px 4px;
            border: 2px solid #9a9db0;
            background: var(--card);
            color: var(--text);
            font-size: .72rem;
            font-weight: 600;
            cursor: pointer
        }

        .st.b.f {
            background: #ec407a;
            border-color: #ec407a;
            color: #fff
        }

        .st.b.m {
            background: #43a047;
            border-color: #43a047;
            color: #fff
        }

        .st.rp {
            border-color: #ec407a;
            background: #fde4ee;
            color: #ad1457
        }

        .st.rg {
            border-color: #43a047;
            background: #e3f4e5;
            color: #1b5e20
        }

        .st.b {
            background: #cfd1db;
            border-color: #cfd1db;
            color: #888;
            cursor: not-allowed;
            text-decoration: line-through;
            opacity: .9
        }

        .st.s {
            background: var(--red);
            border-color: var(--red);
            color: #fff
        }

        .leg {
            display: flex;
            gap: 14px;
            justify-content: center;
            font-size: .78rem;
            color: var(--mut)
        }

        .leg i {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 4px;
            border: 2px solid #9a9db0;
            vertical-align: -2px;
            margin-right: 4px
        }

        .fx {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(60px + env(safe-area-inset-bottom, 0px));
            max-width: 480px;
            margin: auto;
            background: var(--card);
            padding: 12px 16px;
            border-top: 1px solid var(--line);
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 6
        }

        .fx .btn {
            width: auto;
            flex: 1
        }

        .nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-width: 480px;
            margin: auto;
            background: var(--card);
            border-top: 1px solid var(--line);
            display: flex;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            z-index: 7
        }

        .nav button {
            flex: 1;
            border: 0;
            background: none;
            color: var(--mut);
            padding: 9px 0 8px;
            font: inherit;
            font-size: .72rem;
            display: grid;
            gap: 2px;
            justify-items: center;
            cursor: pointer
        }

        .nav button.on {
            color: var(--red);
            font-weight: 700
        }

        label {
            display: grid;
            gap: 4px;
            font-size: .82rem;
            font-weight: 600;
            margin-bottom: 10px
        }

        .pm {
            display: flex;
            gap: 12px;
            align-items: center;
            border: 2px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer
        }

        .pm.on {
            border-color: var(--red);
            background: rgba(200, 32, 43, .07)
        }

        .pm b {
            display: block
        }

        .pm small {
            color: var(--mut)
        }

        .sum div {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: .92rem
        }

        .sum .tot {
            border-top: 1px dashed var(--line);
            margin-top: 6px;
            padding-top: 10px;
            font-weight: 700;
            font-size: 1.1rem
        }

        .tk {
            border-top: 6px solid var(--ok)
        }

        .tk h2 {
            margin: 0;
            color: var(--ok);
            font: 700 1.15rem Poppins, sans-serif
        }

        .kv {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 12px 0
        }

        .kv small {
            color: var(--mut);
            display: block;
            font-size: .72rem
        }

        .pill {
            display: inline-block;
            background: #fff3d6;
            color: #6b4a00;
            border-radius: 99px;
            padding: 3px 10px;
            font-size: .75rem;
            font-weight: 700
        }

        .call {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font: 600 1rem Poppins, sans-serif
        }

        .toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            top: calc(70px + env(safe-area-inset-top, 0px));
            z-index: 50;
            background: #1c1d26;
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: .9rem;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
            max-width: 90%;
            text-align: center;
            border-left: 5px solid var(--red)
        }

        @media(min-width:481px) {
            body {
                background: #d9dae3
            }

            #app {
                box-shadow: 0 0 30px rgba(0, 0, 0, .25)
            }
        }
    </style>
</head>

        const iso = n => { const d = new Date(); d.setDate(d.getDate() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10) };
        const fd = d => new Date(d + 'T00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
        let mem = []; const load = () => { try { return JSON.parse(localStorage.getItem('jtb_' + (U ? U.mobile : '')) || '[]') } catch (e) { return mem } };

        const key = () => st.dir + st.date + st.time;
        const remote = {}; const gmap = k => { const m = { ...(remote[k] || {}) }; load().filter(b => b.key == k && b.status != 'Cancelled').forEach(b => b.pax.forEach(p => m[p.s] = p.g)); return m };
        const taken = k => Object.keys(gmap(k));
        async function pull() { if (!API) return; const k = key(); try { { const x = await (await fetch(API + '/api/taken/' + encodeURIComponent(k))).json(); remote[k] = Array.isArray(x) ? Object.fromEntries(x.map(s => [s, 'Other'])) : x } if (st.scr == 'seat') { const lost = st.seats.filter(s => remote[k][s]); if (lost.length) { lost.forEach(s => { st.seats.splice(st.seats.indexOf(s), 1); delete st.gen[s] }); toast('Seat ' + lost.join(', ') + ' was just booked by someone else.') } rs() } } catch (e) { } }
        const L = () => st.dir == 's' ? S : P;
        let go = s => { st.scr = s; window.scrollTo(0, 0); draw() };
        const hdr = (t, sub, back) => `<div class="top"><div class="row"><button class="ib" onclick="${back}">${ic('bk')}</button><div><h1>${t}</h1><small>${sub}</small></div></div></div>`;
        const nav = () => `<div class="nav">${[['home', 'hm', 'Home'], ['bk', 'tk', 'My Bookings'], ['help', 'ph', 'Help']].map(([k, i, t]) => `<button class="${(st.scr == k || (k == 'home' && ['res', 'seat', 'pts', 'pax', 'pay'].includes(st.scr))) ? 'on' : ''}" onclick="go('${k}')">${ic(i)}${t}</button>`).join('')}</div>`;
        const am = `<div class="am"><span>${ic('sn')}A.C.</span><span>${ic('zp')}Charging</span><span>${ic('sh')}Safe &amp; Reliable</span></div>`;
        const wa = t => `https://wa.me/${WA}?text=${encodeURIComponent(t)}`;

        function draw() { clearInterval(tm); if (REQUIRE_LOGIN && !U && !['login', 'signup', 'otp'].includes(st.scr)) st.scr = 'login'; const a = $('app'); a.innerHTML = ({ home, res, seat, pts, pax, pay, tick, bk, help, trk, drv, login, signup, otp })[st.scr]() + ((U || (!REQUIRE_LOGIN && !['login', 'signup', 'otp'].includes(st.scr))) ? nav() : ''); if (st.scr == 'trk') track(); if (st.scr == 'seat' && API) tm = setInterval(pull, 8000); tl(a) }

        const post = (p, b) => { const c = new AbortController(), t = setTimeout(() => c.abort(), 60000); return fetch(API + p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b), signal: c.signal }).then(async r => ({ ok: r.ok, ...await r.json().catch(() => ({})) })).catch(() => ({ ok: false, error: 'Cannot reach the server. Check your internet connection and the API URL setting.' })).finally(() => clearTimeout(t)) };
        const amsg = t => { const e = $('am'); if (e) { e.textContent = t; e.style.display = 'block' } else toast(t) };

        const users = () => { try { return JSON.parse(localStorage.getItem('jtusers') || '{}') } catch (e) { return {} } };
        function setU(u) { U = u; try { localStorage.setItem('jtu', JSON.stringify(u)) } catch (e) { } go('home') }
        function logout() { U = null; try { localStorage.removeItem('jtu') } catch (e) { } st.scr = REQUIRE_LOGIN ? 'login' : 'home'; draw() }
        function login() {
            return `<div class="top big"><div class="row sp"><div class="row"><img class="logo" src="${LOGO}" alt="Jyotirling"><div><h1>Jyotirling Travels</h1><small>Login to book your seat</small></div></div>${lb()}</div></div>
<div class="card search"><h3 style="margin:0 0 12px">Login</h3><label>Mobile number<input id="lm" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile"></label><label>Password<input id="lp" type="password"></label><button class="btn" id="lb" onclick="doLogin()">Login</button><p id="am" style="display:none;color:var(--red);font-size:.85rem;margin:10px 0 0;font-weight:600"></p>

        }
        async function doLogin() {
            const m = $('lm').value.trim(), p = $('lp').value; if (!/^\d{10}$/.test(m) || !p) return amsg('Enter mobile number and password');
            if (API) { const r = await wait('lb', 'Logging in… please wait', () => post('/api/login', { mobile: m, password: p })); if (!r.ok) return amsg(r.error || 'Login failed'); return setU({ name: r.name, mobile: m, token: r.token }) }
            const u = users()[m]; if (!u || u.p != p) return amsg('Wrong mobile or password'); setU({ name: u.n, mobile: m })
        }

        async function deliver() { const a = st.auth; if (API) { const r = await post('/api/otp/send', { mobile: a.m, purpose: a.mode }); if (!r.ok) { amsg(r.error || 'Could not send OTP'); return false } st.demo = r.devOtp || null } else { st.demo = String(Math.floor(100000 + Math.random() * 900000)) } return true }

        }

        function bk() { const a = load(); return `<div class="top"><h1>My Bookings</h1></div>` + (a.length ? a.map((b, i) => `<div class="card"><div class="row sp"><b>${CT[b.dir][0]} → ${CT[b.dir][1]}</b><span class="pill">${b.status}</span></div><div style="font-size:.88rem;color:var(--mut);margin:6px 0">${fd(b.date)} · ${b.time} · Seats ${b.seats.join(', ')} · ₹${b.amt}${b.refundSt ? ' · ' + b.refundSt + ' ₹' + b.refund : ''}</div><div class="row"><button class="btn l" onclick="st.cur=load()[${i}];go('vt')">View</button>${b.status != 'Cancelled' ? `<button class="btn l" onclick="st.cur=load()[${i}];go('trk')">${ic('pin')}Track</button><button class="btn l" onclick="cx(${i})">Cancel</button>` : ''}</div></div>`).join('') : `<div class="card" style="text-align:center;color:var(--mut)">No bookings yet.</div>`) }
        const dep = b => { const [m, p] = b.time.split(' '); let [h, n] = m.split(':').map(Number); if (p == 'PM' && h < 12) h += 12; if (p == 'AM' && h == 12) h = 0; return new Date(b.date + 'T' + String(h).padStart(2, '0') + ':' + String(n).padStart(2, '0') + ':00') };
        const pct = b => { const h = (dep(b) - Date.now()) / 36e5; for (const [x, p] of REFUND) if (h >= x) return p; return 0 };
        async function cx(i) {
            const a = load(), b = a[i]; if (dep(b) < Date.now()) return toast('Bus already departed – cannot cancel.');
            const on = b.pm == 'upi', p = on ? pct(b) : 0, r = Math.round(b.amt * p / 100);
            if (!confirm('Cancel booking ' + b.id + '?\n' + (on ? 'Refund: ₹' + r + ' (' + p + '%) to your original payment method.' : 'Cash booking – nothing to refund.'))) return;
            b.status = 'Cancelled'; b.refund = r; b.refundSt = r ? 'Refund pending' : '';
            if (r && b.payId && API) { try { const x = await fetch(API + '/api/refund', { method: 'POST', headers: AH(), body: JSON.stringify({ paymentId: b.payId, amount: r }) }); if (x.ok) b.refundSt = 'Refund initiated' } catch (e) { } }
            if (API) fetch(API + '/api/bookings/' + b.id + '/cancel', { method: 'POST', headers: AH(), body: JSON.stringify({ refund: b.refund, refundSt: b.refundSt }) }).catch(() => { }); save(a); draw(); toast('Booking cancelled. Seats released.' + (r ? ' Refund ₹' + r + '.' : ''))
        }
        const _go = go; go = s => { if (s == 'vt') { st.scr = 'vt'; window.scrollTo(0, 0); $('app').innerHTML = tkt(st.cur, "go('bk')", 0) + nav(); tl($('app')); return } _go(s) };

        function trk() { const b = st.cur; return hdr('Track Bus', CT[b.dir].join(' → ') + ' · ' + b.time, "go('bk')") + `<div class="card"><div id="map" style="height:380px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--mut);text-align:center;padding:12px">${GMAPS && API ? 'Loading map…' : 'Live tracking is not set up yet.<br>Call 9112824694 for the bus location.'}</div><p id="trs" style="color:var(--mut);font-size:.85rem"></p></div>` }
        async function track() {
            if (!GMAPS || !API) return; await loadJs('https://maps.googleapis.com/maps/api/js?key=' + GMAPS, () => window.google && google.maps); const b = st.cur, id = encodeURIComponent(b.dir + b.date + b.time);
            mp = new google.maps.Map($('map'), { center: { lat: 17.5, lng: 74.8 }, zoom: 9, disableDefaultUI: true, zoomControl: true }); mk = null;
            const tick = async () => { try { const d = await (await fetch(API + '/api/location/' + id)).json(); if (!d.lat) return $('trs').textContent = 'Bus has not started sharing location yet.'; const p = { lat: d.lat, lng: d.lng }; if (mk) mk.setPosition(p); else mk = new google.maps.Marker({ map: mp, position: p, title: 'Jyotirling Bus' }); mp.panTo(p); $('trs').textContent = 'Updated ' + new Date(d.t).toLocaleTimeString() + (d.speed ? ' · ' + Math.round(d.speed * 3.6) + ' km/h' : '') } catch (e) { $('trs').textContent = 'Unable to fetch location.' } }; tick(); tm = setInterval(tick, 10000)
        }
        function drv() { return hdr('Driver Mode', 'Share live bus location', "go('help')") + `<div class="card"><label>Trip<select id="dt">${['s', 'p'].flatMap(d => TM[d].map(x => `<option value="${d + iso(0) + x}">${CT[d].join(' → ')} · ${x}</option>`)).join('')}</select></label><label>Driver PIN<input id="dpin" type="password"></label><button class="btn" id="dbtn" onclick="drvGo()">Start sharing</button><p id="dst" style="color:var(--mut);font-size:.85rem">Keep this screen open while driving.</p></div>` }
        function drvGo() {
            if (wid != null) { navigator.geolocation.clearWatch(wid); wid = null; $('dbtn').textContent = 'Start sharing'; return $('dst').textContent = 'Stopped.' }
            if (!API) return toast('Backend URL not configured.'); const id = $('dt').value, pin = $('dpin').value; $('dbtn').textContent = 'Stop sharing';
            wid = navigator.geolocation.watchPosition(p => fetch(API + '/api/location/' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-driver-pin': pin }, body: JSON.stringify({ lat: p.coords.latitude, lng: p.coords.longitude, speed: p.coords.speed }) }).then(x => { $('dst').textContent = x.ok ? 'Sharing live location ✓' : 'Wrong PIN or server error' }).catch(() => { $('dst').textContent = 'Network error' }), () => { $('dst').textContent = 'Please allow location permission' }, { enableHighAccuracy: true })
        }
        function help() {
            return `<div class="top"><div class="row sp"><div><h1>Help &amp; Contact</h1><small>बुकिंगसाठी संपर्क</small></div>${lb()}</div></div>${U ? `<div class="card row sp"><div><b>${U.name}</b><br><small style="color:var(--mut)">+91 ${U.mobile}</small></div><button class="chip" onclick="logout()">Logout</button></div>` : `<div class="card row sp"><div><b>Guest</b><br><small style="color:var(--mut)">Login is optional</small></div><button class="chip on" onclick="go('login')">Login</button></div>`}<div class="card">${['9112814694', '9112824694', '9112834694', '7499646051', '9503874710'].map(n => `<a class="call" href="tel:+91${n}">${ic('ph')}${n}</a>`).join('')}<div style="height:12px"></div><a class="btn w" target="_blank" rel="noopener" href="${wa('नमस्कार, मला माहिती हवी आहे.')}">${ic('wa')}Chat on WhatsApp</a><div style="height:10px"></div><button class="btn l" onclick="go('drv')">Driver login</button></div>
<div class="card"><b>Daily timings</b><p style="font-size:.9rem;color:var(--mut)">सांगोला → पुणे: 6:30 AM, 7:00 PM<br>पुणे → सांगोला: 6:00 AM, 3:00 PM</p></div>`}
        draw();
    </script>
</body>
